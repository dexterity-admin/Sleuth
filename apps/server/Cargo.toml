[package]
name = "sleuth-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Sleuth office server: one shared index behind an authenticated HTTPS API"

[lib]
name = "sleuth_server"
path = "src/lib.rs"

[[bin]]
name = "sleuth-server"
path = "src/main.rs"

[dependencies]
sleuth-core.workspace = true
sleuth-engine.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
time = "0.3"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
getrandom = "0.3"
base64 = "0.22"
x509-parser = "0.18"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows.workspace = true
# The server window (Sleuth Server): WebView2 in a native window, the same
# libraries the desktop app uses through Tauri.
wry = "0.57"
tao = "0.37"

[dev-dependencies]
ureq = "3"
