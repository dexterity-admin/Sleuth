[workspace]
resolver = "2"
members = ["crates/sleuth-core", "crates/sleuth-office", "crates/sleuth-extract", "crates/sleuth-lanes", "crates/sleuth-engine", "apps/worker", "apps/desktop/src-tauri", "apps/server"]

[workspace.package]
version = "1.1.0"
edition = "2024"
authors = ["Dexterity Design Services Pvt. Ltd."]
license = "LicenseRef-Proprietary"
repository = "https://github.com/dexterity-admin/Sleuth"

[workspace.dependencies]
sleuth-core = { path = "crates/sleuth-core" }
sleuth-engine = { path = "crates/sleuth-engine" }
sleuth-office = { path = "crates/sleuth-office" }
sleuth-extract = { path = "crates/sleuth-extract" }
sleuth-lanes = { path = "crates/sleuth-lanes" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_NetworkManagement_WNet",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Power",
  "Win32_System_WinRT",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security_Cryptography",
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Globalization",
  "Foundation",
  "Foundation_Collections",
  "Win32_Storage_IndexServer",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Registry",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
