# Publishes the website in site/ (plus the user guide PDF) to GitHub Pages.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/Sleuth-User-Guide.pdf", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the user guide
        run: cp docs/Sleuth-User-Guide.pdf site/Sleuth-User-Guide.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
